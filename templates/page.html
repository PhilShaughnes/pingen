<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <style>
      /* ================================================================
         ACTIVE PALETTES — vars: --bg --text --muted --accent --surface
         To swap: edit named block + matching @media block for "auto"
         Palette library at bottom
         ================================================================ */

      :root,
      [data-theme="dark"] {
        --bg: #262624;
        --text: #c2c0b6;
        --muted: #9c9a92;
        --accent: #83a598;
        --surface: #30302e;
      }
      [data-theme="light"] {
        --bg: #faf4ed;
        --text: #575279;
        --muted: #797593;
        --accent: #286983;
        --surface: #f2e9e1;
      }
      /* auto: follows OS preference */
      @media (prefers-color-scheme: light) {
        [data-theme="auto"] { --bg: #faf4ed; --text: #575279; --muted: #797593; --accent: #286983; --surface: #f2e9e1; }
      }
      @media (prefers-color-scheme: dark) {
        [data-theme="auto"] { --bg: #262624; --text: #c2c0b6; --muted: #9c9a92; --accent: #83a598; --surface: #30302e; }
      }

      /* --- Base --- */
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        max-width: 90rem;
        margin: 0 auto;
        padding: 1.5rem 2.5rem;
        color: var(--text);
        background: var(--bg);
      }
      h1 { margin-bottom: 1.5rem; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { background: var(--surface); padding: 0.2rem 0.4rem; border-radius: 3px; font-size: 0.9em; }
      pre { background: var(--surface); padding: 1rem; border-radius: 4px; overflow-x: auto; }
      pre code { padding: 0; background: none; }
      /* --- Nav --- */
      nav { margin-bottom: 2rem; padding: 0.5rem 0; border-bottom: 1px solid var(--surface); }
      nav ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 1rem; }

      /* --- Theme switcher --- */
      .theme-switcher {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.5rem;
        background: var(--bg);
        padding: 0.25rem;
        border-radius: 4px;
        opacity: 0.5;
      }
      .theme-switcher:hover {
        opacity: 1;
      }
      .theme-switcher button {
        background: none;
        border: none;
        color: var(--text);
        font-size: 0.85rem;
        padding: 0;
        cursor: pointer;
        opacity: 0.35;
      }
      .theme-switcher button:hover {
        opacity: 0.75;
      }
      .theme-switcher button.active {
        opacity: 1;
      }

      /* --- Sections (bookmark columns) --- */
      .sections { columns: 240px; column-gap: 2.5rem; }
      .sections > section { break-inside: avoid; margin-bottom: 1.5rem; }

      /* Section label (h2) — small-caps, border-top */
      .sections > section > h2:first-child {
        margin-top: 0;
        margin-bottom: 0.5rem;
        padding-top: 0.3rem;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        border-top: 2px solid var(--surface);
      }

      /* Sub-section label (h3) — same family, quieter */
      .sections h3 {
        margin-top: 0.75rem;
        margin-bottom: 0.25rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      /* Top-level bookmarks — block links with dot marker */
      .sections ul { list-style: none; padding: 0; margin: 0; }
      .sections li > p { font-size: 0.925rem; margin: 0; }
      .sections > section > ul { padding-left: 1.2rem; }
      .sections > section > ul > li { list-style-type: disc; }
      .sections > section > ul > li::marker { color: var(--muted); font-size: 0.65em; }
      .sections a { color: var(--accent); }

      /* Nested items — annotation/metadata, not navigation */
      .sections ul ul {
        padding: 0 0 0.25rem 0.75rem;
        border-left: 2px solid var(--surface);
        color: var(--muted);
        font-size: 0.8rem;
      }
      .sections ul ul a { color: var(--accent); }

      /* ================================================================
         PALETTE LIBRARY — copy into active blocks above.
         Vars: --bg --text --muted --accent --surface

         LIGHT
         paper:    --bg:#f8f6f1 --text:#4c432e --muted:#7a6a4e --accent:#7a6040 --surface:#ede9e0
         white:    --bg:#ffffff --text:#222222 --muted:#555555 --accent:#3366cc --surface:#f5f5f5
         gazette:  --bg:#f2f7ff --text:#000000 --muted:#444444 --accent:#0066cc --surface:#e8f0f8
         rp-dawn:  (see dawn theme above)

         DARK
         charcoal: --bg:#2c3545 --text:#e0e4ec --muted:#8fa0b8 --accent:#9ccfd8 --surface:#1e2535
         flexoki:  --bg:#1a1a18 --text:#cecdc3 --muted:#878580 --accent:#ce5d97 --surface:#272725
         onedark:  --bg:#282c34 --text:#dfd9d6 --muted:#9098a8 --accent:#61afef --surface:#313640
         espresso: --bg:#21211f --text:#d1b59a --muted:#8a7a6a --accent:#c8a070 --surface:#2a2a28
         rp-moon:  (see moon theme above)
         gruvbox-dark: (see gruvbox-dark theme above)

         gruvbox accents (swap into gruvbox-light/dark):
           orange: light=#d65d0e dark=#fe8019
           blue:   light=#458588 dark=#83a598  ← active
           aqua:   light=#689d6a dark=#8ec07c
           purple: light=#8f3f71 dark=#d3869b
         ================================================================ */
    </style>
  </head>
  <body>
    {{if .Pages}}
    <nav>
      <ul>
        {{range .Pages}}
        <li><a href="{{.Slug}}.html">{{.Title}}</a></li>
        {{end}}
      </ul>
      <div class="theme-switcher">
        <button data-theme="auto" onclick="setTheme('auto')" title="Auto">
          0
        </button>
        <button data-theme="light" onclick="setTheme('light')" title="Light">
          1
        </button>
        <button data-theme="dark" onclick="setTheme('dark')" title="Dark">
          2
        </button>
      </div>
    </nav>
    {{end}}

    <main>{{.Content}}</main>
    <script>
      function setTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("theme", t);
        document
          .querySelectorAll(".theme-switcher button")
          .forEach((b) => b.classList.toggle("active", b.dataset.theme === t));
      }
      setTheme(localStorage.getItem("theme") || "{{.Theme}}");
    </script>
  </body>
</html>
